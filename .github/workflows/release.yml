name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check tag matches extension version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "Tag $GITHUB_REF_NAME does not match package version v$version"
            exit 1
          }

      - name: Package
        run: npx vsce package --githubBranch main --no-dependencies -o rhat.vsix

      - uses: actions/upload-artifact@v6
        with:
          name: rhat-vsix
          path: rhat.vsix
          if-no-files-found: error

      # Manual runs only build the package. Pushing a version tag publishes it.
      - name: Publish with Trusted Publishing
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: npx vsce publish --oidc --packagePath rhat.vsix
